function search(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const type=document.getElementById('type').value;
  const list=records.filter(r=>(!type||r.type===type)&&(!q||r.label.toLowerCase().includes(q)));
  document.getElementById('count').textContent=list.length+' rekod dijumpai';
  document.getElementById('results').innerHTML=list.map((r,i)=>`
    <div class="item">
      <b>${r.label}</b>
      <div class="small">${r.type}</div>
      <a href="#" onclick="openPdf(${i});return false;">Buka PDF</a>
    </div>`).join('');
  window.current=list;
}
function openPdf(i){
  const r=window.current[i];
  document.getElementById('pdf').src=encodeURI(r.file);
  document.getElementById('viewer').style.display='block';
  window.scrollTo({top:document.getElementById('viewer').offsetTop-10,behavior:'smooth'});
}
document.getElementById('q').addEventListener('input',search);
search();
