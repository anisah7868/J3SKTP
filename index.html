<head>

<title>Carian Jadual SK Telok Pulai</title>
<style>
:root{--teal:#18a9a0;--blue:#1677b7;--pink:#f06a8a;--text:#17324d;--muted:#657786;--line:#d9e6e6}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#eafcff,#fff0f6);color:var(--text)}
header{background:linear-gradient(135deg,#087f7a,var(--blue));color:#fff;text-align:center;padding:16px 12px}
.badge{width:72px;height:72px;object-fit:contain;background:#fff;border-radius:50%;padding:5px}header h1{margin:8px 0 0;font-size:clamp(25px,7vw,34px);line-height:1.12}header h1 span{display:block}header p{margin:8px 0 0;font-size:14px}
main{max-width:720px;margin:auto;padding:13px 11px 30px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 12px;box-shadow:0 8px 24px #00000012}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.tab{min-height:46px;padding:8px 5px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--text);font-weight:700;cursor:pointer}.tab.active{background:var(--teal);color:#fff;border-color:var(--teal)}
.search{display:grid;grid-template-columns:1fr auto;gap:8px}input{width:100%;height:51px;padding:0 14px;border:2px solid #b8dede;border-radius:12px;font-size:17px;outline:none}input:focus{border-color:var(--teal)}.clear{height:51px;padding:0 15px;border:0;border-radius:12px;background:var(--pink);color:#fff;font-weight:700;cursor:pointer}
.hint{text-align:center;color:var(--muted);font-size:13px;margin:10px 0 4px}.results{display:grid;gap:8px;margin-top:10px}.result{width:100%;text-align:left;border:1px solid #cfe0e0;background:#f8ffff;border-radius:12px;padding:12px;cursor:pointer;color:var(--text)}.result:hover{background:#eefafa;border-color:var(--teal)}.result strong{display:block;font-size:15px}.result small{color:var(--muted)}
.viewer{margin-top:14px;display:none}.viewer iframe{width:100%;height:70vh;min-height:520px;border:1px solid var(--line);border-radius:12px}.viewer-title{font-weight:700;margin:0 0 8px}
</style>
</head>
<body>
<header><img class="badge" src="LENCANA_SK_Telok_Pulai.png" alt="Lencana SK Telok Pulai"><h1><span>CARIAN JADUAL</span><span>SK TELOK PULAI</span></h1><p>Jadual berkuat kuasa 12 Oktober 2026</p></header>
