<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#18a9a0">
<title>Carian Jadual SK Telok Pulai</title>
<style>
:root {
  --teal:#18a9a0;
  --teal-dark:#087f7a;
  --blue:#1677b7;
  --green:#79c83b;
  --yellow:#d8e83a;
  --pink:#f06a8a;
  --bg:#f4fbfa;
  --text:#17324d;
  --muted:#657786;
  --line:#d9e6e6;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(180deg,#eefaf8 0%,#f8fbff 100%);
  color:var(--text);
  min-height:100vh;
}
header{
  background:linear-gradient(135deg,var(--teal-dark),var(--blue));
  color:#fff;
  text-align:center;
  padding:18px 14px 22px;
  border-bottom-left-radius:26px;
  border-bottom-right-radius:26px;
  box-shadow:0 5px 18px rgba(8,127,122,.20);
}
.badge{
  width:82px;
  height:82px;
  object-fit:contain;
  background:#fff;
  border-radius:50%;
  padding:5px;
  display:block;
  margin:0 auto 10px;
  box-shadow:0 3px 12px rgba(0,0,0,.16);
}
header h1{
  margin:0;
  font-size:clamp(25px,7vw,34px);
  line-height:1.12;
  letter-spacing:-.3px;
}
header h1 span{display:block}
header p{
  margin:9px 0 0;
  font-size:15px;
  line-height:1.4;
  opacity:.97;
}
main{
  width:min(720px,100%);
  margin:0 auto;
  padding:16px 12px 30px;
}
.search-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:15px;
  box-shadow:0 7px 25px rgba(23,50,77,.08);
}
.section-title{
  text-align:center;
  font-size:15px;
  font-weight:700;
  margin:0 0 10px;
}
.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-bottom:13px;
}
.tab{
  min-height:46px;
  padding:8px 5px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#fff;
  color:var(--text);
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}
.tab.active{
  background:linear-gradient(135deg,var(--teal),var(--blue));
  color:#fff;
  border-color:var(--teal);
}
.search-row{
  display:grid;
  grid-template-columns:1fr 88px;
  gap:8px;
}
input{
  width:100%;
  height:51px;
  padding:0 14px;
  border:1px solid #cfdedf;
  border-radius:11px;
  background:#fff;
  color:var(--text);
  font-size:17px;
  outline:none;
}
input:focus{
  border-color:var(--teal);
  box-shadow:0 0 0 3px rgba(24,169,160,.10);
}
button.search{
  height:51px;
  border:0;
  border-radius:11px;
  background:linear-gradient(135deg,var(--pink),#e84f74);
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 3px 8px rgba(240,106,138,.25);
}
.hint{
  margin:10px 2px 0;
  color:var(--muted);
  font-size:12px;
  line-height:1.4;
  text-align:center;
}
.message{
  display:none;
  margin-top:11px;
  padding:10px 12px;
  border-radius:10px;
  background:#f1f8f7;
  color:var(--text);
  font-size:14px;
  text-align:center;
}
.viewer{
  display:none;
  margin-top:15px;
  background:#fff;
  border:1px solid #e0e7ed;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 5px 20px rgba(18,52,77,.08);
}
.viewer-title{
  padding:12px 14px;
  border-bottom:1px solid #e5ebef;
  font-size:15px;
  font-weight:700;
}
iframe{display:block;width:100%;height:72vh;border:0}
@media(max-width:520px){
  header{padding:16px 12px 20px}
  .badge{width:72px;height:72px;margin-bottom:8px}
  header h1{font-size:27px}
  header p{font-size:14px;margin-top:7px}
  main{padding:13px 11px 26px}
  .search-card{padding:14px;border-radius:16px}
  .search-row{grid-template-columns:1fr;gap:8px}
  input,button.search{height:50px}
  button.search{width:100%}
}
@media(max-width:360px){
  .badge{width:66px;height:66px}
  header h1{font-size:24px}
  .tab{font-size:13px}
}
</style>
</head>
<body>
<header>
  <img class="badge" src="LENCANA_SK_Telok_Pulai.jpeg" alt="Lencana SK Telok Pulai">

const q=document.getElementById("q"), message=document.getElementById("message");
const viewer=document.getElementById("viewer"), pdf=document.getElementById("pdf");
const viewerTitle=document.getElementById("viewerTitle");
const placeholders={"Guru":"Taip nama guru...","Kelas":"Taip nama kelas...","Bilik Khas":"Taip nama bilik khas..."};

document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
    currentType=btn.dataset.type;
    q.placeholder=placeholders[currentType];
    q.value="";
    message.style.display="none";
    viewer.style.display="none";
    q.focus();
  });
});
function searchNow(){
  const term=q.value.trim().toLowerCase();
  viewer.style.display="none"; message.style.display="none";
  if(!term){showMessage("Sila masukkan nama untuk carian.");return;}
  const matches=records.filter(r=>r.type===currentType && r.label.toLowerCase().includes(term));
  if(matches.length===0){showMessage("Tiada rekod dijumpai.");return;}
  if(matches.length>1){showMessage("Terdapat lebih daripada satu padanan. Sila taip nama dengan lebih lengkap.");return;}
  const r=matches[0];
  viewerTitle.textContent=r.label;
  pdf.src=encodeURI(r.file);
  viewer.style.display="block";
  viewer.scrollIntoView({behavior:"smooth",block:"start"});
}
function showMessage(msg){message.textContent=msg;message.style.display="block";}
q.addEventListener("keydown",e=>{if(e.key==="Enter")searchNow();});
