const q = document.getElementById("q");
const message = document.getElementById("message");
const viewer = document.getElementById("viewer");
const pdf = document.getElementById("pdf");
const viewerTitle = document.getElementById("viewerTitle");

const placeholders = {
  "Guru":"Taip nama guru...",
  "Kelas":"Taip nama kelas...",
  "Bilik Khas":"Taip nama bilik khas..."
};

document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    btn.classList.add("active");
    currentType = btn.dataset.type;
    q.placeholder = placeholders[currentType];
    q.value = "";
    message.style.display = "none";
    viewer.style.display = "none";
    q.focus();
  });
});

function searchNow() {
  const term = q.value.trim().toLowerCase();
  viewer.style.display = "none";
  message.style.display = "none";

  if (!term) {
    showMessage("Sila masukkan nama untuk carian.");
    return;
  }

  const matches = records.filter(r =>
    r.type === currentType && r.label.toLowerCase().includes(term)
  );

  if (matches.length === 0) {
    showMessage("Tiada rekod dijumpai.");
    return;
  }

  if (matches.length > 1) {
    showMessage("Terdapat lebih daripada satu padanan. Sila taip nama dengan lebih lengkap.");
    return;
  }

  const r = matches[0];
  viewerTitle.textContent = r.label;
  pdf.src = encodeURI(r.file);
  viewer.style.display = "block";
  viewer.scrollIntoView({behavior:"smooth", block:"start"});
}

function showMessage(msg) {
  message.textContent = msg;
  message.style.display = "block";
}

q.addEventListener("keydown", e => {
  if (e.key === "Enter") searchNow();
});
