<title>Carian Jadual SK Telok Pulai</title>
<style>
:root {
  --blue:#07527a;
  --blue-dark:#063f5e;
  --bg:#f3f7fa;
  --text:#17324d;
  --muted:#6b7c8c;
  --line:#d7e0e7;
}
* { box-sizing:border-box; }
html,body { margin:0; padding:0; }
body {
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}
header {
  background:linear-gradient(180deg,var(--blue),var(--blue-dark));
  color:#fff;
  text-align:center;
  padding:26px 16px 24px;
}
header h1 {
  margin:0;
  font-size:clamp(27px,7vw,44px);
  line-height:1.12;
  font-weight:800;
  letter-spacing:-.5px;
}
header p {
  margin:10px 0 0;
  font-size:16px;
  line-height:1.4;
  opacity:.95;
}
main {
  width:min(720px,100%);
  margin:0 auto;
  padding:20px 14px 34px;
}
.search-card {
  background:#fff;
  border:1px solid #e3eaf0;
  border-radius:18px;
  padding:18px;
  box-shadow:0 8px 28px rgba(18,52,77,.09);
}
.section-title {
  font-size:15px;
  font-weight:700;
  margin:0 0 10px;
  color:var(--text);
}
.tabs {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:14px;
}
.tab {
  min-height:48px;
  padding:10px 8px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#fff;
  color:var(--text);
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}
.tab.active {
  background:var(--blue);
  color:#fff;
  border-color:var(--blue);
}
.search-row {
  display:grid;
  grid-template-columns:1fr 92px;
  gap:9px;
}
input {
  width:100%;
  height:52px;
  padding:0 15px;
  border:1px solid #cfd9e1;
  border-radius:11px;
  background:#fff;
  color:var(--text);
  font-size:17px;
  outline:none;
}
input:focus {
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(7,82,122,.10);
}
button.search {
  height:52px;
  border:0;
  border-radius:11px;
  background:var(--blue);
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}
.hint {
  margin:11px 2px 0;
  color:var(--muted);
  font-size:13px;
  line-height:1.4;
  text-align:center;
}
.message {
  display:none;
  margin-top:12px;
  padding:11px 12px;
  border-radius:10px;
  background:#f0f4f7;
  color:var(--text);
  font-size:14px;
  text-align:center;
}
.viewer {
  display:none;
  margin-top:16px;
  background:#fff;
  border:1px solid #e0e7ed;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 5px 20px rgba(18,52,77,.08);
}
.viewer-title {
  padding:12px 14px;
  border-bottom:1px solid #e5ebef;
  font-size:15px;
  font-weight:700;
}
iframe {
  display:block;
  width:100%;
  height:72vh;
  border:0;
}
@media (max-width:520px) {
  header { padding:22px 14px 20px; }
  header h1 { font-size:clamp(25px,7vw,34px); line-height:1.12; letter-spacing:-.4px; }
  header p { font-size:14px; margin-top:8px; }
  main { padding:14px 12px 28px; }
  .search-card { padding:15px; border-radius:16px; }
  .tabs { gap:6px; }
  .tab { min-height:45px; font-size:14px; padding:8px 5px; }
  .search-row { grid-template-columns:1fr; gap:8px; }
  input,button.search { height:50px; }
  button.search { width:100%; }
  .hint { font-size:12px; }
}
@media (max-width:360px) {
  header h1 { font-size:clamp(19px,5.8vw,25px); white-space:nowrap; letter-spacing:-.8px; }
  .tab { font-size:13px; }
}

header h1 span{display:block;}

</style>
</head>

let currentType = "Guru";

const q = document.getElementById("q");
const message = document.getElementById("message");
const viewer = document.getElementById("viewer");
const pdf = document.getElementById("pdf");
const viewerTitle = document.getElementById("viewerTitle");

const placeholders = {
  "Guru":"Taip nama guru...",
  "Kelas":"Taip nama kelas...",
  "Bilik Khas":"Taip nama bilik khas..."
};

document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    btn.classList.add("active");
    currentType = btn.dataset.type;
    q.placeholder = placeholders[currentType];
    q.value = "";
    message.style.display = "none";
    viewer.style.display = "none";
    q.focus();
  });
});

function searchNow() {
  const term = q.value.trim().toLowerCase();
  viewer.style.display = "none";
  message.style.display = "none";

  if (!term) {
    showMessage("Sila masukkan nama untuk carian.");
    return;
  }

  const matches = records.filter(r =>
    r.type === currentType && r.label.toLowerCase().includes(term)
  );

  if (matches.length === 0) {
    showMessage("Tiada rekod dijumpai.");
    return;
  }

  if (matches.length > 1) {
    showMessage("Terdapat lebih daripada satu padanan. Sila taip nama dengan lebih lengkap.");
    return;
  }

  const r = matches[0];
  viewerTitle.textContent = r.label;
  pdf.src = encodeURI(r.file);
  viewer.style.display = "block";
  viewer.scrollIntoView({behavior:"smooth", block:"start"});
}

function showMessage(msg) {
  message.textContent = msg;
  message.style.display = "block";
}

q.addEventListener("keydown", e => {
  if (e.key === "Enter") searchNow();
});
