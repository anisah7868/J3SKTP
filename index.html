let type="guru", current=null;
const q=document.getElementById("q"),results=document.getElementById("results"),hint=document.getElementById("hint");
const viewer=document.getElementById("viewer"),viewerTitle=document.getElementById("viewerTitle"),pdf=document.getElementById("pdf");

function render(){
  const term=q.value.trim().toLowerCase();
  results.innerHTML="";
  viewer.style.display="none";
  pdf.src="";
  current=null;
  if(!term){hint.textContent="Taip huruf atau nama untuk melihat hasil carian.";return}
  const found=data[type].filter(x=>x.label.toLowerCase().includes(term));
  hint.textContent=found.length?`${found.length} hasil ditemui. Klik nama untuk buka PDF.`:"Tiada hasil carian.";
  found.forEach(x=>{
    const b=document.createElement("button");
    b.className="result";
    const s=document.createElement("strong"); s.textContent=x.label;
    const sm=document.createElement("small"); sm.textContent="Klik untuk buka PDF";
    b.appendChild(s); b.appendChild(sm);
    b.onclick=()=>{
      current=x;
      viewerTitle.textContent=x.label;
      pdf.src=x.view + "#toolbar=1&navpanes=0&view=FitH";
      viewer.style.display="block";
      viewer.scrollIntoView({behavior:"smooth",block:"start"});
    };
    results.appendChild(b);
  });
}

document.querySelectorAll(".tab").forEach(btn=>btn.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
  type=btn.dataset.type;
  q.value="";
  q.placeholder=type==="guru"?"Taip nama guru...":type==="kelas"?"Taip kelas, contoh: 5...":"Taip nama bilik khas...";
  render(); q.focus();
});
q.addEventListener("input",render);
document.getElementById("clear").onclick=()=>{q.value="";render();q.focus()};

document.getElementById("downloadBtn").onclick=()=>{
  if(current) window.open(current.download,"_blank");
};
document.getElementById("newtabBtn").onclick=()=>{
  if(current) window.open(current.view,"_blank");
};
document.getElementById("backBtn").onclick=()=>{
  viewer.style.display="none"; pdf.src=""; current=null;
  window.scrollTo({top:0,behavior:"smooth"});
  q.focus();
};
</script>
